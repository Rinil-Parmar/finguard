{% extends 'base.html' %}

{% block title %}Delete Savings Goal | FinGuard{% endblock %}

{% block content %}
<section class="mx-auto flex min-h-[calc(100vh-150px)] max-w-lg items-center px-4 py-10 sm:px-6">
    <div class="w-full rounded-lg border border-rose-200 bg-white p-6 shadow-soft">
        <p class="text-sm font-semibold uppercase text-rose-700">Delete goal</p>
        <h1 class="mt-2 text-3xl font-bold text-slate-950">Delete "{{ goal.name }}"?</h1>
        <p class="mt-3 text-sm leading-6 text-slate-600">This will remove this savings goal from your account.</p>
        <form method="post" class="mt-6 flex flex-col gap-3 sm:flex-row">
            {% csrf_token %}
            <button type="submit" class="inline-flex justify-center rounded-md bg-rose-700 px-5 py-3 text-sm font-semibold text-white hover:bg-rose-800">Delete</button>
            <a href="{% url 'savings_goal_list' %}" class="inline-flex justify-center rounded-md border border-slate-300 bg-white px-5 py-3 text-sm font-semibold text-slate-700 hover:border-finance-600 hover:text-finance-700">Cancel</a>
        </form>
    </div>
</section>
{% endblock %}
