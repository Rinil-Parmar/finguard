{% extends 'base.html' %}

{% block title %}Reset Password | FinGuard{% endblock %}

{% block content %}
<section class="mx-auto flex min-h-[calc(100vh-150px)] max-w-md items-center px-4 py-10 sm:px-6">
    <div class="w-full rounded-lg border border-slate-200 bg-white p-6 shadow-soft">
        <p class="text-sm font-semibold uppercase text-finance-700">Password help</p>
        <h1 class="mt-2 text-3xl font-bold text-slate-950">Reset your password</h1>
        <p class="mt-3 text-sm leading-6 text-slate-600">Enter your account email and Django will generate a reset link.</p>

        <form method="post" class="mt-6 space-y-5">
            {% csrf_token %}
            <div>
                <label for="{{ form.email.id_for_label }}" class="mb-1 block text-sm font-medium text-slate-700">Email address</label>
                <input type="email" name="{{ form.email.name }}" id="{{ form.email.id_for_label }}" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm outline-none focus:border-finance-600 focus:ring-2 focus:ring-finance-100">
            </div>
            <button type="submit" class="w-full rounded-md bg-finance-600 px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-finance-700">
                Send reset link
            </button>
        </form>
    </div>
</section>
{% endblock %}
