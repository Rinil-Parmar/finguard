{% extends 'base.html' %}

{% block title %}Reset Link Sent | FinGuard{% endblock %}

{% block content %}
<section class="mx-auto flex min-h-[calc(100vh-150px)] max-w-md items-center px-4 py-10 sm:px-6">
    <div class="w-full rounded-lg border border-slate-200 bg-white p-6 text-center shadow-soft">
        <p class="text-sm font-semibold uppercase text-finance-700">Check email</p>
        <h1 class="mt-2 text-3xl font-bold text-slate-950">Reset link sent</h1>
        <p class="mt-3 text-sm leading-6 text-slate-600">
            If the email matches an account, a password reset link has been generated.
        </p>
        <a href="{% url 'login' %}" class="mt-6 inline-flex rounded-md bg-finance-600 px-5 py-3 text-sm font-semibold text-white hover:bg-finance-700">Back to login</a>
    </div>
</section>
{% endblock %}
